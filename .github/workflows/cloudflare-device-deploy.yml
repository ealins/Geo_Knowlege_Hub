name: Deploy GeoAcademic to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoacademic-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub Actions secrets are required for production deployment."
            exit 1
          fi

      - name: Install locked dependencies
        run: npx --yes bun@1.3.14 install --frozen-lockfile

      - name: Build production Worker
        run: npx --yes bun@1.3.14 run build

      - name: Require OmniRoute credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OMNIROUTE_API_KEY:-}"

      - name: Configure OmniRoute Worker secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_API_KEY" | ./node_modules/.bin/wrangler versions secret put OMNIROUTE_API_KEY --name research-pulse-global

      - name: Configure OpenAI Worker secret when available
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            printf '%s' "$OPENAI_API_KEY" | ./node_modules/.bin/wrangler versions secret put OPENAI_API_KEY --name research-pulse-global
            echo "OPENAI_FALLBACK_SECRET_CONFIGURED=true"
          else
            echo "::warning::OPENAI_API_KEY GitHub Actions secret is not configured; OpenAI fallback requires a separately configured Worker secret."
          fi

      - name: Configure OpenRouter Worker fallback when available
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || secrets.OPENROUTER_MODEL }}
          OPENROUTER_URL: ${{ vars.OPENROUTER_URL || secrets.OPENROUTER_URL }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENROUTER_API_KEY:-}" && -n "${OPENROUTER_MODEL:-}" ]]; then
            printf '%s' "$OPENROUTER_API_KEY" | ./node_modules/.bin/wrangler versions secret put OPENROUTER_API_KEY --name research-pulse-global
            printf '%s' "$OPENROUTER_MODEL" | ./node_modules/.bin/wrangler versions secret put OPENROUTER_MODEL --name research-pulse-global
            if [[ -n "${OPENROUTER_URL:-}" ]]; then
              printf '%s' "$OPENROUTER_URL" | ./node_modules/.bin/wrangler versions secret put OPENROUTER_URL --name research-pulse-global
            fi
            echo "OPENROUTER_FALLBACK_SECRET_CONFIGURED=true"
          else
            echo "::warning::OpenRouter fallback is not configured: set OPENROUTER_API_KEY and OPENROUTER_MODEL as a repository secret/variable or configure them directly on the Worker."
          fi

      - name: Configure direct NVIDIA Worker fallback when available
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || secrets.NVIDIA_MODEL }}
          NVIDIA_URL: ${{ vars.NVIDIA_URL || secrets.NVIDIA_URL }}
        run: |
          set -euo pipefail
          if [[ -n "${NVIDIA_API_KEY:-}" ]]; then
            printf '%s' "$NVIDIA_API_KEY" | ./node_modules/.bin/wrangler versions secret put NVIDIA_API_KEY --name research-pulse-global
            if [[ -n "${NVIDIA_MODEL:-}" ]]; then
              printf '%s' "$NVIDIA_MODEL" | ./node_modules/.bin/wrangler versions secret put NVIDIA_MODEL --name research-pulse-global
            fi
            if [[ -n "${NVIDIA_URL:-}" ]]; then
              printf '%s' "$NVIDIA_URL" | ./node_modules/.bin/wrangler versions secret put NVIDIA_URL --name research-pulse-global
            fi
            echo "NVIDIA_FALLBACK_SECRET_CONFIGURED=true"
          else
            echo "::warning::NVIDIA_API_KEY GitHub Actions secret is not configured; direct NVIDIA fallback remains unavailable."
          fi

      - name: Deploy active Worker
        run: ./node_modules/.bin/wrangler deploy
