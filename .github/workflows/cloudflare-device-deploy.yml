name: Deploy GeoAcademic to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoacademic-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub Actions secrets are required for production deployment."
            exit 1
          fi

      - name: Install locked dependencies
        run: npx --yes bun@1.3.14 install --frozen-lockfile

      - name: Build production Worker
        run: npx --yes bun@1.3.14 run build

      - name: Require OmniRoute credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OMNIROUTE_API_KEY:-}"

      - name: Configure OmniRoute Worker secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OMNIROUTE_API_KEY" | ./node_modules/.bin/wrangler versions secret put OMNIROUTE_API_KEY --name research-pulse-global

      - name: Configure OpenAI Worker secret when available
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            printf '%s' "$OPENAI_API_KEY" | ./node_modules/.bin/wrangler versions secret put OPENAI_API_KEY --name research-pulse-global
            echo "OPENAI_FALLBACK_SECRET_CONFIGURED=true"
          else
            echo "::warning::OPENAI_API_KEY GitHub Actions secret is not configured; OpenAI fallback requires a separately configured Worker secret."
          fi

      - name: Deploy active Worker
        run: ./node_modules/.bin/wrangler deploy
