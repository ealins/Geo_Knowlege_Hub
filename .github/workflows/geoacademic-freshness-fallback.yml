name: GeoAcademic freshness fallback

on:
  workflow_dispatch:
  schedule:
    # Four bounded checks per hour provide a 15-minute backstop when GitHub
    # delays or omits primary cron runs. Workflow-run triggers remain enabled.
    - cron: "2 * * * *"
    - cron: "17 * * * *"
    - cron: "32 * * * *"
    - cron: "47 * * * *"
  workflow_run:
    workflows: ["GeoAcademic fresh ingestion"]
    types: [completed]

concurrency:
  # Isolate each scheduled expression so a pending cron tick cannot replace
  # another tick. Keep manual and workflow_run events serialized by event type.
  group: geoacademic-freshness-fallback-${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-due-sources:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.head_branch == 'main' &&
        (
          github.event.workflow_run.event == 'schedule' ||
          github.event.workflow_run.event == 'workflow_dispatch'
        ) &&
        (
          github.event.workflow_run.conclusion == 'success' ||
          github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'timed_out'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GEOACADEMIC_BASE_URL: https://geoacademic.app
      INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
      INGESTION_FETCH_CONCURRENCY: "3"
      INGESTION_LEASE_LIMIT: "8"
      INGESTION_RUNTIME_MS: "60000"
      INGESTION_BURST_MODE: "false"
      INGESTION_WORKER_TRIGGER: "github-actions-freshness-fallback"
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Validate worker script
        run: node --check scripts/ingestion-worker.mjs

      - name: Queue due source refreshes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"refresh-due","limit":20,"trigger":"github-actions-freshness-fallback"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch)"
          echo "$response"
          node -e '
            const v = JSON.parse(process.argv[1]);
            if (v.error) throw new Error(v.error);
            if (typeof v.queued !== "number") throw new Error("refresh-due returned no numeric queue count");
            const skipReasons =
              v.skip_reasons && typeof v.skip_reasons === "object" && !Array.isArray(v.skip_reasons)
                ? v.skip_reasons
                : null;
            if (skipReasons) {
              for (const [reason, count] of Object.entries(skipReasons)) {
                if (typeof count !== "number") throw new Error(`refresh-due skip reason ${reason} is not numeric`);
              }
            } else {
              console.log("::warning::refresh-due omitted skip_reasons; continuing with reduced diagnostics");
            }
            console.log("FRESHNESS_FALLBACK_REFRESH", JSON.stringify({
              queued: v.queued,
              scanned: typeof v.scanned === "number" ? v.scanned : null,
              by_category: v.by_category ?? {},
              blocked_reprobes_queued: v.blocked_reprobes_queued ?? 0,
              skip_reasons: skipReasons
            }));
          ' "$response"

      - name: Fetch leased due sources
        run: node scripts/ingestion-worker.mjs

      - name: Drain bounded normalization work
        # The scheduled fallback must also drain normalization when the primary
        # workflow is missed. Avoid duplicate work after a successful primary run;
        # still drain after a failed/timed-out primary invocation.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 160 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"drain","limit":4,"trigger":"github-actions-freshness-fallback-normalize"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch)"
          echo "$response"
          node -e '
            const v = JSON.parse(process.argv[1]);
            if (v.error) throw new Error(v.error);
            if (typeof v.processed !== "number") {
              throw new Error("normalization drain returned no numeric processed count");
            }
            const responseText = JSON.stringify(v);
            const providerGatewayFailure =
              v.provider_gateway_failure === true ||
              responseText.includes("CIRCUIT_OPEN_GATEWAY_5XX") ||
              responseText.includes("circuit open after repeated recent primary gateway");
            console.log("FRESHNESS_FALLBACK_NORMALIZE", JSON.stringify({
              processed: v.processed,
              ok: v.ok ?? null,
              failed: v.failed ?? null,
              dead: v.dead ?? null,
              normalized: v.normalized ?? null,
              skipped: v.skipped ?? null,
              records_created: v.recordsCreated ?? v.records_created ?? null,
              records_updated: v.recordsUpdated ?? v.records_updated ?? null,
              provider_gateway_failure: providerGatewayFailure
            }));
            if (providerGatewayFailure) {
              console.log("::warning::Provider gateway unavailable; bounded deterministic fallback may have run, and model-dependent work remains queued.");
            }
          ' "$response"
