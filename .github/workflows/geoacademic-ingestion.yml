name: GeoAcademic fresh ingestion

on:
  workflow_dispatch:
  schedule:
    # Keep four runs per hour away from quarter-hour boundaries. The :07
    # expression is separate so the hourly discovery sweep can identify it
    # reliably even when GitHub starts the scheduled job late.
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_run:
    # A successful scheduled fallback is also a watchdog for missed primary cron events.
    # The job condition below accepts only fallback runs whose original event was schedule,
    # preventing a workflow_run-to-workflow_run loop.
    workflows:
      - "Deploy GeoAcademic to Cloudflare"
      - "GeoAcademic freshness fallback"
    types: [completed]

concurrency:
  # Isolate each scheduled cron expression so a slow :22 run cannot replace
  # a pending :37/:52 run in the same GitHub concurrency group. Keep non-cron
  # events serialized by event type, including workflow_run recovery events.
  group: geoacademic-ingestion-${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review-jobs:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.name == 'Deploy GeoAcademic to Cloudflare' ||
          (
            github.event.workflow_run.name == 'GeoAcademic freshness fallback' &&
            github.event.workflow_run.event == 'schedule' &&
            github.event.workflow_run.head_branch == 'main'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEOACADEMIC_BASE_URL: https://geoacademic.app
      INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
      OMNIROUTE_URL: "https://omniroute.geoacademic.app/v1"
      OMNIROUTE_MODEL: "auto"
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      REVIEW_RUNTIME_MS: "210000"
      REVIEW_LEASE_LIMIT: "4"
      REVIEW_CONCURRENCY: "8"
    steps:
      - name: Check out worker
        uses: actions/checkout@v4
      - name: Validate worker scripts
        run: node --check scripts/ingestion-worker.mjs && node --check scripts/job-review-worker.mjs
      - name: Check OmniRoute credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${OMNIROUTE_API_KEY:-}" ]]; then
            echo "AI_PROVIDER=OmniRoute"
          else
            echo "::warning::OMNIROUTE_API_KEY is missing; AI vacancy review will be skipped, but source ingestion must continue."
          fi
      - name: Verify fetch lease endpoint
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"lease-fetch","probe":true,"limit":1,"trigger":"github-actions-lease-smoke"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch \
            | tee /tmp/lease.json
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("/tmp/lease.json","utf8"));
            if (v.probe !== true) throw new Error("fetch lease probe did not reach the ingestion queue");
            console.log("LEASE_SMOKE_OK", JSON.stringify({probe:v.probe, due:v.due}));
          '
      - name: Queue due source refreshes
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"refresh-due","limit":40,"trigger":"github-actions-due-source-refresh"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch)"
          echo "$response"
          node -e '
            const v = JSON.parse(process.argv[1]);
            if (v.error) throw new Error(v.error);
            if (typeof v.queued !== "number") throw new Error("refresh-due returned no queue count");
            console.log("DUE_SOURCE_REFRESH", JSON.stringify({queued:v.queued, skipped:v.skipped ?? 0}));
          ' "$response"

      - name: Fetch fresh source data first
        env:
          INGESTION_FETCH_CONCURRENCY: "6"
          INGESTION_LEASE_LIMIT: "12"
          INGESTION_RUNTIME_MS: "120000"
          INGESTION_BURST_MODE: "true"
          INGESTION_WORKER_TRIGGER: "github-actions-fresh-first"
        run: node scripts/ingestion-worker.mjs
      - name: Reseed high-value discovery pages
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"reseed-high-value","limit":20,"trigger":"github-actions-deep-discovery-v7"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch

      - name: Fetch reseeded discovery pages
        env:
          INGESTION_FETCH_CONCURRENCY: "6"
          INGESTION_LEASE_LIMIT: "12"
          INGESTION_RUNTIME_MS: "90000"
          INGESTION_BURST_MODE: "true"
          INGESTION_WORKER_TRIGGER: "github-actions-deep-discovery-v7"
        run: node scripts/ingestion-worker.mjs

      - name: Queue programme discovery coverage sweep
        if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *'
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"discover-programmes","limit":10,"trigger":"github-actions-programme-coverage"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch
      - name: Queue due structured provider refreshes
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"backfill-providers","limit":30,"trigger":"github-actions-structured-provider-refresh"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch)"
          echo "$response"
          node -e '
            const v = JSON.parse(process.argv[1]);
            if (v.error) throw new Error(v.error);
            console.log("STRUCTURED_PROVIDER_REFRESH", JSON.stringify({
              promote_queued: v.promote_queued ?? 0,
              publications_queued: v.publications_queued ?? 0,
              projects_queued: v.projects_queued ?? 0
            }));
          ' "$response"

      - name: Drain structured provider backlog
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          deadline=$((SECONDS+60))
          processed=0
          failures=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! response="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 35 \
              -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"action":"drain-providers","limit":1,"trigger":"github-actions-provider-refresh"}' \
              https://geoacademic.app/api/public/hooks/ingest-batch)"; then
              failures=$((failures+1))
              echo "::warning::Provider drain timed out or failed (consecutive failures=$failures); continuing to the next provider task."
              if [ "$failures" -ge 3 ]; then
                echo "PROVIDER_DRAIN_STOPPED_AFTER_FAILURES processed=$processed"
                break
              fi
              sleep 1
              continue
            fi
            failures=0
            echo "$response"
            count="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.processed||0))' "$response")"
            processed=$((processed+count))
            if [ "$count" -eq 0 ]; then
              echo "PROVIDER_DRAIN_IDLE processed=$processed"
              break
            fi
            sleep 1
          done
          echo "PROVIDER_DRAIN_PROCESSED=$processed"

      - name: Queue pending raw snapshots for normalization
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"backfill-raw","limit":100,"trigger":"github-actions-pending-raw-backfill"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch)"
          echo "$response"
          node -e '
            const v = JSON.parse(process.argv[1]);
            if (v.error) throw new Error(v.error);
            for (const key of ["raw_candidates", "queued", "already_queued"]) {
              if (typeof v[key] !== "number") throw new Error(`backfill-raw returned no numeric ${key}`);
            }
            console.log("RAW_NORMALIZATION_BACKFILL", JSON.stringify({
              raw_candidates: v.raw_candidates,
              queued: v.queued,
              already_queued: v.already_queued,
              by_classification: v.by_classification ?? {}
            }));
          ' "$response"

      - name: Recover transient semantic failures
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"recover-semantic-failures","limit":500,"trigger":"github-actions-semantic-recovery"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch

      - name: Drain canonical normalization backlog
        id: drain-normalization
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          deadline=$((SECONDS+180))
          # Process up to four NORMALIZE tasks per request; the API uses bounded two-task waves.
          processed=0
          failures=0
          backfill_passes=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! response="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 35 \
              -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"action":"drain","limit":4,"trigger":"github-actions-normalize-backlog"}' \
              https://geoacademic.app/api/public/hooks/ingest-batch)"; then
              failures=$((failures+1))
              echo "::warning::Normalization drain timed out or failed (consecutive failures=$failures); continuing without blocking fresh fetches."
              if [ "$failures" -ge 3 ]; then
                echo "NORMALIZE_DRAIN_STOPPED_AFTER_FAILURES processed=$processed"
                break
              fi
              sleep 1
              continue
            fi
            failures=0
            echo "$response"
            count="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.processed||0))' "$response")"
            processed=$((processed+count))
            gateway_unavailable="$(node -e '
              const v = JSON.parse(process.argv[1]);
              const text = JSON.stringify(v);
              process.stdout.write(
                v.provider_gateway_failure === true ||
                text.includes("CIRCUIT_OPEN_GATEWAY_5XX") ||
                text.includes("circuit open after repeated recent primary gateway")
                  ? "1"
                  : "0"
              );
            ' "$response")"
            if [ "$gateway_unavailable" -eq 1 ]; then
              echo "::warning::Normalization drain stopped after a provider gateway failure; deferred work remains queued for a later run."
              echo "gateway_unavailable=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$count" -eq 0 ]; then
              # Draining can free sources that had pending snapshots skipped by
              # the first backfill pass. Requeue those exact snapshots and keep
              # draining, with a strict two-pass cap inside the existing deadline.
              if [ "$backfill_passes" -lt 2 ]; then
                backfill_response="$(curl --fail-with-body --silent --show-error \
                  --connect-timeout 10 --max-time 25 \
                  -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
                  -H "Content-Type: application/json" \
                  --data '{"action":"backfill-raw","limit":100,"trigger":"github-actions-post-drain-raw-backfill"}' \
                  https://geoacademic.app/api/public/hooks/ingest-batch)"
                echo "$backfill_response"
                queued="$(node -e '
                  const v = JSON.parse(process.argv[1]);
                  if (v.error) throw new Error(v.error);
                  for (const key of ["raw_candidates", "queued", "already_queued"]) {
                    if (typeof v[key] !== "number") throw new Error(`backfill-raw returned no numeric ${key}`);
                  }
                  process.stdout.write(String(v.queued));
                ' "$backfill_response")"
                if [ "$queued" -gt 0 ]; then
                  backfill_passes=$((backfill_passes+1))
                  echo "POST_DRAIN_RAW_BACKFILL queued=$queued pass=$backfill_passes"
                  sleep 1
                  continue
                fi
              fi
              echo "NORMALIZE_DRAIN_IDLE processed=$processed"
              break
            fi
            sleep 1
          done
          echo "NORMALIZE_DRAIN_PROCESSED=$processed"
      - name: Drain vacancy review backlog
        if: ${{ env.OMNIROUTE_API_KEY != '' && steps.drain-normalization.outputs.gateway_unavailable != 'true' }}
        env:
          REVIEW_RUNTIME_MS: "120000"
          REVIEW_LEASE_LIMIT: "6"
          REVIEW_CONCURRENCY: "4"
        run: node scripts/job-review-worker.mjs
      - name: Review newly fetched job pages
        if: ${{ env.OMNIROUTE_API_KEY != '' && steps.drain-normalization.outputs.gateway_unavailable != 'true' }}
        env:
          REVIEW_RUNTIME_MS: "45000"
          REVIEW_LEASE_LIMIT: "10"
          REVIEW_CONCURRENCY: "4"
        run: node scripts/job-review-worker.mjs

      - name: Refresh public pulse projection and insights
        if: ${{ !cancelled() }}
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 90 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"refresh-insights","limit":1,"trigger":"github-actions-public-pulse-refresh"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch | tee /tmp/pulse-refresh.json
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("/tmp/pulse-refresh.json", "utf8"));
            if (v.error) throw new Error(v.error);
            if (!v.pulse || typeof v.pulse.checked !== "number" || typeof v.pulse.projected !== "number") throw new Error("pulse refresh returned no projection counts");
            console.log("PUBLIC_PULSE_REFRESH", JSON.stringify({checked:v.pulse.checked, projected:v.pulse.projected, insights:v.insights ?? null, partial:v.partial ?? false}));
          '
