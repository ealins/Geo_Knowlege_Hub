name: GeoAcademic open-engine CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "open-engine/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/geoacademic-*.yml"
      - ".github/workflows/cloudflare-device-deploy.yml"
  pull_request:
    paths:
      - "open-engine/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/geoacademic-*.yml"
      - ".github/workflows/cloudflare-device-deploy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python entrypoints
        run: |
          python -m compileall -q open-engine/cloudrun open-engine/backend open-engine/worker
          python -m py_compile \
            open-engine/backend/main.py \
            open-engine/backend/internal.py \
            open-engine/worker/worker.py \
            open-engine/worker/minio.py \
            open-engine/worker/processor.py \
            open-engine/worker/date_normalization.py \
            open-engine/worker/deterministic_extractors.py \
            open-engine/worker/test_date_normalization.py \
            open-engine/worker/test_deterministic_extractors.py \
            open-engine/worker/scheduler.py \
            open-engine/worker/verifier.py \
            open-engine/worker/ai_router.py \
            open-engine/worker/snapshotter.py \
            open-engine/worker/seed.py \
            open-engine/worker/reprocess.py \
            open-engine/cloudrun/migrate.py \
            open-engine/cloudrun/import_legacy_sources.py \
            open-engine/cloudrun/batch_runner.py \
            open-engine/cloudrun/public_enrichment_bridge.py \
            open-engine/cloudrun/review_enrichment.py \
            open-engine/cloudrun/publication_enrichment.py \
            open-engine/cloudrun/ats_enrichment.py \
            open-engine/cloudrun/qa.py \
            open-engine/cloudrun/qa_database.py \
            open-engine/cloudrun/qa_slugs.py \
            open-engine/cloudrun/qa_scope.py

      - name: Test deterministic extraction and date normalization
        run: |
          python -m pip install beautifulsoup4==4.13.4
          cd open-engine/worker
          python -m unittest -v test_deterministic_extractors.py test_date_normalization.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build frontend and test transient extraction retry policy
        run: |
          bun install --frozen-lockfile
          bun test src/lib/canonical-write-metrics.test.ts src/lib/ai-provider-config.test.ts src/lib/extraction/transient-errors.test.ts src/lib/normalization-task-payload.test.ts src/lib/semantic-recovery-policy.test.ts src/lib/host-fetch-deferral-policy.test.ts src/lib/fetch-failure-policy.test.ts scripts/ingestion-worker-policy.test.mjs src/lib/source-refresh-policy.test.ts src/lib/queue-drain-policy.test.ts src/lib/vacancy-posting-policy.test.ts src/lib/backfill-coverage.test.ts src/lib/schedule-settings-errors.test.ts
          bun run build

      - name: Validate shell entrypoints
        run: |
          bash -n open-engine/deploy-oracle.sh
          bash -n open-engine/deploy.sh
          bash -n open-engine/oci/bootstrap-cloud-shell.sh

      - name: Build ingestion container
        run: docker build -f open-engine/Dockerfile.ingestion open-engine

      - name: Validate Oracle compose file
        run: |
          cp open-engine/.env.oracle.example open-engine/.env.oracle.ci
          docker compose \
            --env-file open-engine/.env.oracle.ci \
            -f open-engine/docker-compose.oracle.yml \
            config >/dev/null

      - name: Validate portable compose file
        run: |
          cp open-engine/.env.prod.example open-engine/.env.prod.ci
          docker compose \
            --env-file open-engine/.env.prod.ci \
            -f open-engine/docker-compose.prod.yml \
            config >/dev/null
