name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/dump.mjs
        env:
          URLS: '["https://www.isprs.org/calendar/", "https://www.isprs.org/news/", "https://www.3dgeoinfo.org/", "https://agile-online.org/", "https://www.intergeo.de/en", "https://www.rspsoc.org.uk/events", "https://www.egu.eu/meetings/", "https://www.dgpf.de/"]'
      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagout
          git commit -m "probe output" || true
          git pull --rebase -q || true
          git push || true
