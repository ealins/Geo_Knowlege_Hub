name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/dump.mjs
        env:
          URLS: '["https://www.jobs.ac.uk/job/DTK728/open-rank-faculty-position-in-mechanical-engineering","https://www.jobs.ac.uk/job/DTL075/phd-studentship-advancing-multi-mission-satellite-radar-for-monitoring-permafrost-degradation-and-erosion-in-a-changing-arctic","https://www.jobs.ac.uk/job/DTK878/phd-studentship-overcoming-the-quantification-problem-in-deep-raman-spectroscopy-using-advanced-optical-metrology-and-3d-phantoms","https://www.jobs.ac.uk/job/DTK783/project-archivist-national-soils-map-archive","https://www.jobs.ac.uk/job/DSQ223/klesch-postdoctoral-fellowship-in-history-of-art-and-technology"]'
      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagout
          git commit -m "probe output" || true
          git pull --rebase -q || true
          git push || true
