name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/dump.mjs
        env:
          URLS: '["https://www.isprs.org/calendar/2026.aspx", "https://www.isprs.org/calendar/2027.aspx", "https://www.isprs.org/calendar/other_calendar.aspx", "https://agile-online.org/conference-2027", "https://agile-online.org/conference-2027/call-for-papers-2027", "https://www.egu27.eu/", "https://www.dgpf.de/cal/Eventdetail/236/114|136|113|101/dgpf-jahrestagung-2027.html"]'
      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagout
          git commit -m "probe output" || true
          git pull --rebase -q || true
          git push || true
