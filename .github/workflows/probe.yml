name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/dump.mjs
        env:
          URLS: '["https://www.mygermanuniversity.com/subjects/remote-sensing/master/application-deadlines", "https://www.mygermanuniversity.com/subjects/geodesy-and-geoinformatics/master/application-deadlines", "https://www.mygermanuniversity.com/subjects/geoinformatics-and-geophysics/master/application-deadlines", "https://www.mygermanuniversity.com/subjects/remote-sensing/international-programs/application-deadlines", "https://www.mygermanuniversity.com/master/geoinformatics-and-spatial-data-science/589", "https://www2.daad.de/deutschland/studienangebote/international-programmes/en/detail/6963", "https://www2.daad.de/deutschland/studienangebote/international-programmes/en/detail/4562", "https://www.myguide.de/en/international-programmes-master/detail/technische-universitaet-berlin-international-masters-programme-in-geodesy-and-geoinformation-science-6084/?ip-id=6084", "https://www.mastersportal.com/studies/259804/geodesy-and-geoinformation.html"]'
      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagout
          git commit -m "probe output" || true
          git pull --rebase -q || true
          git push || true
