name: GeoAcademic production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy GeoAcademic to Cloudflare"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify active production Worker and public data
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://geoacademic.app"

          for attempt in $(seq 1 12); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            page_code=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/?smoke=$nonce" || true)
            health_code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/api/public/data-health?smoke=$nonce" || true)
            jobs_code=$(curl -L -sS -o /tmp/jobs.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/jobs/?sector=all&smoke=$nonce" || true)
            events_code=$(curl -L -sS -o /tmp/events.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/events/?smoke=$nonce" || true)
            programmes_code=$(curl -L -sS -o /tmp/programmes.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/programmes/?smoke=$nonce" || true)
            researchers_code=$(curl -L -sS -o /tmp/researchers.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/researchers/?smoke=$nonce" || true)
            projects_code=$(curl -L -sS -o /tmp/projects.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/projects/?smoke=$nonce" || true)

            read -r jobs_cards events_cards programmes_cards researchers_cards projects_cards < <(python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class LinkParser(HTMLParser):
              def __init__(self, prefix):
                  super().__init__()
                  self.prefix = prefix
                  self.count = 0
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  href = dict(attrs).get("href")
                  if href and href.startswith(self.prefix) and href.rstrip("/") != self.prefix.rstrip("/"):
                      self.count += 1

          counts = []
          for name in ("jobs", "events", "programmes", "researchers", "projects"):
              parser = LinkParser(f"/{name}/")
              parser.feed(Path(f"/tmp/{name}.html").read_text(errors="replace"))
              counts.append(parser.count)
          print(*counts)
          PY
            )

            echo "Attempt $attempt: home=$page_code health=$health_code jobs=$jobs_code/$jobs_cards events=$events_code/$events_cards programmes=$programmes_code/$programmes_cards researchers=$researchers_code/$researchers_cards projects=$projects_code/$projects_cards"
            [[ -s /tmp/health.json ]] && { echo -n "health: "; head -c 1500 /tmp/health.json; echo; } || true

            if [[ "$page_code" == "200" && "$health_code" == "200" && "$jobs_code" == "200" && "$events_code" == "200" && "$programmes_code" == "200" && "$researchers_code" == "200" && "$projects_code" == "200" ]] && \
               grep -q "Research Pulse" /tmp/home.html && \
               (( jobs_cards > 0 )) && (( events_cards > 0 )) && (( programmes_cards > 0 )) && (( researchers_cards > 0 )) && (( projects_cards > 0 )); then
              if node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const counts = health.public_surface_counts ?? {};
          if (health.ok !== true) throw new Error('production health is not ok');
          if (Number(counts.institutions) < 1) throw new Error('public institution count is empty');
          if (Number(counts.opportunities) < 1) throw new Error('Public opportunity count is empty');
          if (Number(counts.events) < 1) throw new Error('Public event count is empty');
          console.log('Production passed:', JSON.stringify({
            institutions: counts.institutions,
            researchers: counts.researchers,
            opportunities: counts.opportunities,
            publications: counts.publications,
            projects: counts.projects,
            events: counts.events,
            rendered_job_links: process.env.JOBS_CARDS,
            rendered_event_links: process.env.EVENTS_CARDS,
            open_engine: health.open_engine,
          }));
          NODE
              then
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Active geoacademic.app deployment is unhealthy or one or more public catalogues are empty." >&2
          exit 1
