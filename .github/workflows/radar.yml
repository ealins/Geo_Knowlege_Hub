name: Geo Radar

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours. Scheduled runs only fire from the default branch (main).
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths: ["config/**", "scripts/**", "site/**", "wrangler.jsonc", ".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: geo-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install headless browser for JavaScript-built pages
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Fetch sources and update feed
        run: node scripts/radar.mjs

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "radar: refresh feed"
            git push
          fi

      - name: Build site
        run: node scripts/build.mjs

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
