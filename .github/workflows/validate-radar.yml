name: Geo Radar validation

on:
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-radar.yml"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-radar.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/radar.mjs
          node --check scripts/source-config.mjs
      - name: Test source configuration guard
        run: npm test
      - name: Build static site
        run: npm run build
